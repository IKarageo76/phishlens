# One grouped pull request per ecosystem per month, minor and patch updates only.
# Major upgrades (React 19, TypeScript 7, Python 3.14...) are done by hand when you choose.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      python-deps: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      frontend-deps: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
